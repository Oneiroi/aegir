# MCP Firewall - Simple Configuration
# Basic configuration for local development

environment: development

server:
  port: 8443
  host: localhost
  tls:
    enabled: true
    cert_file: certs/cert.pem
    key_file: certs/key.pem

auth:
  jwt:
    secret: "simple-dev-key-change-for-production"
    issuer: "aegir"
  api_keys:
    enabled: true

logging:
  level: info
  format: text
  hmac_key: "development-hmac-key-that-is-definitely-32-characters-long"

security:
  # Master switch for all pattern-based detection (ISC-132). Defaults to true;
  # set enabled: false only to run Aegir as a transparent proxy with no scanning.
  detection:
    enabled: true
    response_policy: block   # block | allow | flag
  sanitization:
    enabled: true
    prompt_injection: true

# LLM judge layer (M009). Local-first: default backend is Ollama; API-hosted
# models (provider: openai | anthropic) are explicit opt-in.
judge:
  enabled: false
  base_url: http://localhost:11434
  model: llama3
  timeout_ms: 5000
  # DEBUG/AUDIT ONLY. When true, the judge's reasoning is emitted to the client
  # (X-Aegir-Judge-Reason header + BLOCK error data). The reason can quote the
  # inspected payload verbatim, so this is KNOWN TO VIOLATE GDPR/HIPAA/PCI when
  # that payload contains regulated data. Default false; enabling logs a loud
  # startup WARNING. Use only in trusted debug environments.
  expose_reasoning: false

upstream:
  services:
    - name: local-mcp-service
      url: http://localhost:8080
      enabled: true
      timeout: 30