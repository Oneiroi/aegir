# MCP Firewall - Simple Configuration
# Basic configuration for local development

environment: development

server:
  port: 8443
  host: localhost
  tls:
    enabled: true
    cert_file: certs/cert.pem
    key_file: certs/key.pem

auth:
  jwt:
    secret: "simple-dev-key-change-for-production"
    issuer: "aegir"
    expiration_time: 3600       # 1 hour in seconds
    refresh_expiration: 86400   # 24 hours in seconds
  api_keys:
    enabled: true

logging:
  level: info
  format: text
  hmac_key: "development-hmac-key-that-is-definitely-32-characters-long"

security:
  sanitization:
    enabled: true
    prompt_injection: true

upstream:
  services:
    - name: local-mcp-service
      url: http://localhost:8080
      enabled: true
      timeout: 30